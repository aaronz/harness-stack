[package]
name = "rustnote-tauri"
version = "0.1.0"
description = "A WYSIWYG Markdown Editor"
authors = ["RustNote Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rustnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
e2e-testing = ["tauri-plugin-playwright"]

[dependencies]
tauri-plugin-playwright = { version = "0.2", optional = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
pulldown-cmark = "0.12"
syntect = "5"
comrak = "0.52"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
thiserror = "2"
base64 = "0.22"
dirs = "5"
notify = "6"
once_cell = "1"
printpdf = "0.7"
open = "5"
regex = "1"
ropey = "1.6.1"

[dev-dependencies]
criterion = "0.5"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
