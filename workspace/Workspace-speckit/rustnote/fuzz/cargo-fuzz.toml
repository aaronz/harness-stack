# Cargo Fuzz configuration
# See https://rust-fuzz.github.io/book/cargo-fuzz.html

[project]
name = "rustnote"
version = "0.1.0"

[fuzz.dictionaries]
markdown = """
# Heading
**bold**
*italic*
`code`
- item
1. item
> quote
| table |
"""

[[fuzz.target]]
name = "parse_headings"
mode = "blind"
fuzz = """
fn harness(input: &[u8]) {
    if let Ok(s) = std::str::from_utf8(input) {
        let _ = rustnote_lib::semantic::ast::SemanticDocument::parse(s);
    }
}
"""

[[fuzz.target]]
name = "parse_emphasis"
mode = "blind"
fuzz = """
fn harness(input: &[u8]) {
    if let Ok(s) = std::str::from_utf8(input) {
        let _ = rustnote_lib::semantic::ast::SemanticDocument::parse(s);
    }
}
"""

[[fuzz.target]]
name = "parse_code"
mode = "blind"
fuzz = """
fn harness(input: &[u8]) {
    if let Ok(s) = std::str::from_utf8(input) {
